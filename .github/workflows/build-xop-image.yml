name: Build official XopProtector for Cosmos
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out clean deployment project
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'cmake;3.22.1' 'ndk;26.1.10909125'
      - name: Clone verified official XopProtector revision
        run: |
          git clone https://github.com/xopJack/XopProtector.git /tmp/XopProtector
          cd /tmp/XopProtector
          git checkout --detach 347f20717e32d9d93d081d00c27d91ce75bd84be
          test "$(git rev-parse HEAD)" = "347f20717e32d9d93d081d00c27d91ce75bd84be"
      - name: Build official Java packer and native shell
        working-directory: /tmp/XopProtector
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g"
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :packer:jar exportShellFiles
          mkdir -p "$GITHUB_WORKSPACE/engine"
          cp packer/build/libs/protector-packer-0.8.1.jar "$GITHUB_WORKSPACE/engine/packer.jar"
          cp -a executable/shell-files "$GITHUB_WORKSPACE/engine/shell-files"
          test -s "$GITHUB_WORKSPACE/engine/packer.jar"
          test -s "$GITHUB_WORKSPACE/engine/shell-files/dex/classes.dex"
          test -s "$GITHUB_WORKSPACE/engine/shell-files/libs/arm64-v8a/libprotector.so"
          test -s "$GITHUB_WORKSPACE/engine/shell-files/libs/armeabi-v7a/libprotector.so"
      - name: Verify Python worker syntax
        run: python3 -m py_compile api/server.py
      - name: Set image coordinates
        id: image
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/matrix-xop-worker" >> "$GITHUB_OUTPUT"
      - name: Configure Buildx
        uses: docker/setup-buildx-action@v3
      - name: Sign into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:xop-347f207-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/modegy/matrix-xop-cosmos
            org.opencontainers.image.revision=347f20717e32d9d93d081d00c27d91ce75bd84be
          provenance: true
